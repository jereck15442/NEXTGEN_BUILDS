<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101827" />
    <link rel="icon" type="image/png" href="/icons/icon-192x192.png" />
    <title>NextGen Builds - Offline</title>
    <style>
      :root {
        --color-primary: #101827;
        --color-accent: #2563eb;
        --color-background: #f8fafc;
        --color-surface: #ffffff;
        --color-text: #0f172a;
        --color-text-muted: #64748b;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background-color: var(--color-background);
        color: var(--color-text);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }
      .offline-card {
        background: var(--color-surface);
        border-radius: 1rem;
        padding: 2rem;
        text-align: center;
        max-width: 480px;
        width: 100%;
        box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.1);
      }
      .offline-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }
      h1 { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.5rem; color: var(--color-primary); }
      p { color: var(--color-text-muted); margin-bottom: 1.5rem; line-height: 1.5; }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        padding: 0.75rem 1.5rem;
        background: var(--color-accent);
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        font-weight: 600;
        font-size: 1rem;
        min-height: 44px;
        cursor: pointer;
        text-decoration: none;
      }
      .btn:hover { background: #1d4ed8; }
    </style>
  </head>
  <body>
    <div class="offline-card">
      <div class="offline-icon">📴</div>
      <h1>You're Offline</h1>
      <p>
        It looks like you don't have an internet connection. You can still browse
        previously cached products, but checkout, login, and AI features require
        a connection.
      </p>
      <button class="btn" onclick="window.location.reload()">Try Again</button>
    </div>
    <script>
      // Attempt to reconnect when back online
      window.addEventListener('online', () => {
        window.location.reload();
      });
    </script>
  </body>
</html>
